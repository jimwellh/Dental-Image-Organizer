name: Release

# Spec §7.2: a tag `v<version>` builds the UI and the package, smoke-tests the wheel on macOS,
# publishes to PyPI with Trusted Publishing, and creates the GitHub Release. The embedding model
# is released separately under its own `model-*` tag, which this pattern does not match.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: The tag names the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version)."
            exit 1
          fi
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv build
      - name: The wheel and the sdist carry the built UI
        run: |
          unzip -l dist/*.whl | grep -q "dental_image_organizer/web/index.html"
          tar -tzf dist/*.tar.gz | grep -q "src/dental_image_organizer/web/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: macOS smoke
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: sh scripts/smoke_macos.sh dist/*.whl

  publish:
    name: Publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    # The PyPI project trusts this repository, workflow, and environment; no token is stored.
    environment:
      name: pypi
      url: https://pypi.org/p/dental-image-organizer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Third-party actions in this workflow are pinned to a commit: this job holds the OIDC token
      # that PyPI trusts, and the build jobs make the files it publishes.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *a* | *b* | *rc* | *dev*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes $prerelease

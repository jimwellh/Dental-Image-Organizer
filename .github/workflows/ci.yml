name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --locked
        working-directory: .
      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/openapi.json src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: The wheel carries the built UI
        working-directory: .
        run: |
          uv build --wheel
          unzip -l dist/*.whl | grep -q "dental_image_organizer/web/index.html"

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck comes with the Ubuntu runner image.
      - run: shellcheck --shell=sh scripts/install.sh scripts/smoke_macos.sh

  macos-smoke:
    name: macOS smoke
    # Spec §7.5: the install, launcher, and health smoke test of the release workflow, on every
    # change, against a freshly built wheel on Apple silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv build --wheel
      - run: sh scripts/smoke_macos.sh dist/*.whl

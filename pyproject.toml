[project]
name = "dental-image-organizer"
version = "0.1.0"
description = "Local Mac app that aligns, color-matches, and composes clinical intraoral photos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jimwellh" }]
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.28",
  "numpy>=2.0",
  "onnxruntime>=1.24",
  "opencv-python-headless>=4.10",
  "packaging>=24.0",
  "pillow>=11.0",
  "pi-heif>=1.0",
  "platformdirs>=4.3",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "structlog>=25.1",
  "typer>=0.15",
  "fastapi>=0.146",
  "filelock>=4.2",
  "pydantic>=2.14",
  "python-multipart>=0.0.32",
  "uvicorn>=0.54",
]

[project.scripts]
dio = "dental_image_organizer.cli:app"
dental-image-organizer = "dental_image_organizer.cli:app"

[dependency-groups]
dev = [
  "httpx2>=2.14",
  "hypothesis>=6.120",
  "import-linter>=2.1",
  "mypy>=1.15",
  "onnx>=1.17",
  "pillow-heif>=0.21",
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built UI is gitignored, and hatchling skips ignored files unless they are named here. Set
# for both targets: `uv build` builds the wheel from the sdist, which must carry the UI too.
artifacts = ["src/dental_image_organizer/web/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/dental_image_organizer"]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["doc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pi_heif", "pi_heif.*", "onnxruntime", "onnxruntime.*", "sklearn", "sklearn.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = ["golden: needs real photos in local_fixtures/ (skipped when absent)"]

[tool.importlinter]
root_package = "dental_image_organizer"

[[tool.importlinter.contracts]]
name = "core is pure"
type = "forbidden"
source_modules = ["dental_image_organizer.core"]
forbidden_modules = [
  "dental_image_organizer.ml", "dental_image_organizer.storage",
  "dental_image_organizer.services", "dental_image_organizer.api", "dental_image_organizer.cli",
  "dental_image_organizer.paths", "dental_image_organizer.config",
  "dental_image_organizer.instance", "dental_image_organizer.server",
]

[[tool.importlinter.contracts]]
name = "ml uses core only"
type = "forbidden"
source_modules = ["dental_image_organizer.ml"]
forbidden_modules = [
  "dental_image_organizer.storage", "dental_image_organizer.services",
  "dental_image_organizer.api", "dental_image_organizer.cli", "dental_image_organizer.paths",
  "dental_image_organizer.config", "dental_image_organizer.instance",
  "dental_image_organizer.server",
]

[[tool.importlinter.contracts]]
name = "storage uses core only and takes its folders as arguments"
type = "forbidden"
source_modules = ["dental_image_organizer.storage"]
forbidden_modules = [
  "dental_image_organizer.ml", "dental_image_organizer.services",
  "dental_image_organizer.api", "dental_image_organizer.cli", "dental_image_organizer.paths",
  "dental_image_organizer.config", "dental_image_organizer.instance",
  "dental_image_organizer.server",
]

[[tool.importlinter.contracts]]
name = "services never import the API, the CLI, or the server"
type = "forbidden"
source_modules = ["dental_image_organizer.services"]
forbidden_modules = [
  "dental_image_organizer.api", "dental_image_organizer.cli", "dental_image_organizer.server",
]

[[tool.importlinter.contracts]]
name = "the API never imports the CLI or the server"
type = "forbidden"
source_modules = ["dental_image_organizer.api"]
forbidden_modules = ["dental_image_organizer.cli", "dental_image_organizer.server"]

[[tool.importlinter.contracts]]
name = "the launcher never imports the API, the services, the CLI, or the server"
type = "forbidden"
source_modules = ["dental_image_organizer.launcher"]
forbidden_modules = [
  "dental_image_organizer.api", "dental_image_organizer.services",
  "dental_image_organizer.cli", "dental_image_organizer.server",
]
